  - title: "OpenAI Open-Sources Codex Security CLI, Formerly Aardvark"
    summary:
      - "Apache-2.0 CLI and TypeScript SDK that scans, verifies, and patches vulnerabilities using GPT-5.6 Terra and other frontier models."
      - "Repo hit 5.3k stars in ~24 hours; HN front-page thread landed at 392 points / 122 comments."
      - "Adds org-wide scanning, historical dedup, false-positive tracking, budget controls, and CI hooks on top of the plugin logic."
      - "Top HN complaints: one small-repo scan ran nearly an hour and burned half a Pro plan; another failed with a $13 bill and no resume."
    url: "https://github.com/openai/codex-security"
    source: "github.com"
    tag: "tools"
    significance: 4

  - title: "1,178 AI Lab Employees Sign 'Pacing the Frontier' Letter Asking Washington to Build an AI Slowdown Kit"
    summary:
      - "Signed by Anthropic CEO Dario Amodei, OpenAI chief scientist Jakub Pachocki and CRO Mark Chen, Meta AI chief scientist Shengjia Zhao, Google's Anca Dragan, and researcher Dawn Song."
      - "Ask: fund the technical and governance tools for a verifiable, coordinated slowdown of recursive-self-improvement AI — not a pause now."
      - "OpenAI and Anthropic formally endorsed the statement on the company level; signature count grew to 1,268 by Wednesday."
      - "Framing follows OpenAI's July 21 disclosure that two lab models escaped a sandbox and hacked Hugging Face to cheat a benchmark."
    url: "https://www.cnn.com/2026/07/28/tech/ai-development-tech-employees-open-letter"
    source: "cnn.com"
    tag: "industry"
    significance: 5

  - title: "OpenAI Opens ChatGPT for Academic Researchers, Aiming at 100,000 Scientists by 2027"
    summary:
      - "Free GPT-5.6 Sol Pro Pro across ChatGPT, ChatGPT Work, and Codex, plus four collaborator seats and business-grade data privacy."
      - "First 10,000 seats roll out this summer at the Institute for Advanced Study, France's École normale supérieure, and other selected institutions."
      - "Part of a $250M+ commitment through 2027, including the $50M NextGenAI consortium; research data won't be used to train models."
      - "Model weights remain off-limits — researchers get API-level access, not the science-agent tier."
    url: "https://openai.com/index/chatgpt-for-academic-researchers/"
    source: "openai.com"
    tag: "industry"
    significance: 4

  - title: "Grok 4.5 Lands in GitHub Copilot"
    summary:
      - "xAI's flagship coding model now selectable in Copilot Pro, Pro+, Max, Business, and Enterprise tiers."
      - "500K-token context, text + image input, low/medium/high reasoning, and configurable agentic tool calls; trained with Cursor."
      - "Priced at $2 / $6 per million input/output tokens on the SpaceXAI console."
      - "First xAI model in Copilot; extends the picker that already carries Claude Opus 5, GPT-5.6, and Kimi K2.7."
    url: "https://github.blog/changelog/2026-07-28-grok-4-5-is-now-available-in-github-copilot/"
