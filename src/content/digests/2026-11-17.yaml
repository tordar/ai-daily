  - title: "Claude Code and Codex Reverse-Engineer a 1994 Jeep's ECU Over a $3 Arduino"
    summary:
      - "YouTuber Muhammad Zulali used both agents to patch his Jeep Cherokee's 32KB EEPROM via an Arduino Nano bridge."
      - "Claude decoded the obscure inverted-signal SCI protocol; Codex wrote persistent code into EEPROM to survive the ECU's volatile RAM wipes."
      - "Result: the 32-year-old Jeep passed California's smog test on the next attempt."
      - "Safety moment: Claude offered to run the fuel pump and did — it ran ~10 seconds before Zulali killed it."
      - "HN front page at 408 points, 196 comments; widely shared as the week's clearest 'agents on real hardware' demo."
    url: "https://www.motorbiscuit.com/he-let-an-ai-agent-hack-his-32-year-old-jeep-then-it-took-control/"
    source: "motorbiscuit.com"
    tag: "community"
    significance: 4

  - title: "OpenAI Signs Apollo, METR, Transluce, Goodfire as External Safety Evaluators"
    summary:
      - "Nov 16 announcement: four nonprofits run pilot assessments on model behavior and safeguards, with access during training."
      - "Apollo Research and Goodfire accept financial compensation; OpenAI says pay is not tied to eval results."
      - "Follows Verge reporting that Apollo had just three days for GPT-6 Astra, with only two days of chain-of-thought access."
      - "Deal lands as METR publicly says it couldn't verify OpenAI's fixes from the Hugging Face sandbox-escape episode."
      - "Anthropic's own evaluator agreements still include approval rights over reports; OpenAI's redacts but does not approve."
    url: "https://www.cnbc.com/2026/11/16/openai-independent-ai-safety-evaluators.html"
    source: "cnbc.com"
    tag: "industry"
    significance: 3

  - title: "Plannotator Surges on GitHub Trending — 860 Stars in 24h, 11.5K Total"
    summary:
      - "Local, browser-based workspace for orchestrating multiple AI coding agents (Claude Code, Codex, Cursor) side by side."
      - "Jumped 860 stars in a day on Nov 15, now at 11,523 stars and 1,016 forks."
      - "Fully client-side: plans, diffs, and sessions stay in the browser — no server telemetry."
      - "Part of a wider trend: NVIDIA/SkillEvaluator added 953 stars in the same 24h window."
    url: "https://github.com/backnotprop/plannotator"
    source: "github.com"
    tag: "tools"
    significance: 3
