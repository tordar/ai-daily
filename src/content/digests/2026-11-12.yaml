  - title: "free-claude-code Hits 68.8k Stars Routing Claude Code to Free Provider Tiers"
    summary:
      - "+636 stars today pushes Alishahryar1's local proxy to 68.8k total, 1,248 commits on main."
      - "Forwards Claude Code (and Codex, OpenCode) traffic to 61 providers — NVIDIA NIM, OpenRouter, Groq — claiming 1.3B+ free tokens per month."
      - "Python 3.14 + FastAPI, AGPL-3.0; explicitly `not affiliated with or endorsed by Anthropic`."
      - "`fcc-claude` launcher is the user-facing escape hatch from paid API keys, with per-provider limits still in force."
    url: "https://github.com/Alishahryar1/free-claude-code"
    source: "github.com"
    tag: "open-source"
    significance: 3

  - title: "experientiallabs/experiential Ships a Zero-Markup BYOK Model Gateway"
    summary:
      - "+589 stars today; 16.6k total. OpenAI-compatible router for hosted, BYOK, and local models under Apache-2.0."
      - "`exp capture` scrapes traces from Codex and Claude Code desktop apps (macOS, experimental); `exp build` turns those traces into a custom router."
      - "`exp optimize model` fine-tunes an open-source model using Tinker; `exp code` runs a coding + cowork agent on Pi."
      - "Positions against proprietary gateways with explicit zero-markup pricing and traffic-informed routing."
    url: "https://github.com/experientiallabs/experiential"
    source: "github.com"
    tag: "tools"
    significance: 3
