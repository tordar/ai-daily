  - title: "Chrome's Modern Web Guidance Hits #1 on GitHub Trending"
    summary:
      - "`GoogleChrome/modern-web-guidance-src` tops daily trending with +739 stars; source repo at 3.5k, 1,592 commits on main, Apache-2.0."
      - "128 web platform features and 100+ expert-vetted use cases packaged as agent skills to keep coding agents off legacy patterns."
      - "Google's internal benchmark: 37-point gain in modern best-practice adherence when a generic agent loads the pack."
      - "Installs via `/plugin marketplace add GoogleChrome/modern-web-guidance` in Claude Code, `gh skill install` on the GitHub CLI, or `npx modern-web-guidance@latest install`."
      - "Co-maintained by the Chrome DevRel and Microsoft Edge teams — first real cross-vendor browser-platform skill set for agents."
    url: "https://github.com/GoogleChrome/modern-web-guidance-src"
    source: "github.com"
    tag: "tools"
    significance: 4

