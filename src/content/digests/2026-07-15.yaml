  - title: "Graphify Turns Codebases Into Queryable Knowledge Graphs for AI Agents"
    summary:
      - "Open-source tool that ingests source, SQL schemas, and docs into a graph coding agents can query."
      - "Aim: give agents structured project context instead of raw file crawling."
      - "86.7K stars total, +1,851 today alone; top of GitHub Trending Python this week."
    url: "https://github.com/Graphify-Labs/graphify"
