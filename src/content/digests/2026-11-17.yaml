  - title: "Alibaba Ships Qwen4-Max — 2.4T-Param MoE, 1M Context, $1.50 Input"
    summary:
      - "Nov 15 release, closed weights; API-only via Token Plan, QwenWork, Qoder, and Qwen App."
      - "Priced at $1.50 / $4.50 per million input/output tokens with a 1M-token context window."
      - "Alibaba-reported: 75.7% DeepSWE v1.1, 48.5% Terminal-Bench 4.0, 51.7% Humanity's Last Exam, 1750 Elo on CodeArena."
      - "Vals AI independently ranks it 11th of 38 models (63.20% index), confirming the Terminal-Bench figure but trailing Opus 5.5 and Kimi K3.1 by ~15 pts."
      - "No model card or safety eval published; 27B open-weight sibling still not out."
    url: "https://www.datacamp.com/blog/qwen4-max"
    source: "datacamp.com"
    tag: "models"
