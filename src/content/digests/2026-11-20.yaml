stories:
  - title: "Google Ships Gemini 4 Neon — $3 Input, Between Hydrogen and Carbon"
    summary:
      - "Nov 18 launch via Gemini API, AI Studio, and the Gemini app; priced $3 / $15 per Mtok with a 1M-token context window."
      - "Sits between Gemini 4 Hydrogen ($1.50) and the still-unshipped Gemini 4 Carbon as Google's default coding/reasoning tier."
      - "Google-reported: 70.5% Terminal-Bench Science, 84.0% RiemannBench, 71.3% HLE-Diamond."
      - "Opus 5.5 still edges it on pure Terminal-Bench coding; Neon leads on science and reasoning."
      - "HN launch thread: 1,017 points, 761 comments."
    url: "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-neon/"
    source: "blog.google"
    tag: "models"
    significance: 5

  - title: "Microsoft Ignite Drops Seven MAI Models, Led by MAI Code 2"
    summary:
      - "Nov 17–18 event: MAI Code 2, MAI Code 2 Flash, MAI Cyber 2 Flash, MAI Image 2.7, MAI Realtime 1, Dragon Copilot Transcribe, Decision 1.1."
      - "MAI Code 2 claimed at 98% of GPT-6.1 Sol quality for 40% of the price; MAI Cyber 2 Flash scores 92.3% on CyberGym-E2E vs 91.5% for GPT-6 Astra."
      - "MAI Realtime 1 is Microsoft's first speech-to-speech model at $0.01 per minute."
      - "Rolling out in GitHub Copilot, Foundry preview, and Dragon Copilot clinical workflows."
      - "HN keynote thread: 594 points, 376 comments."
    url: "https://microsoft.ai/news/microsoft-ignite-2026/"
    source: "microsoft.ai"
    tag: "models"
    significance: 5

  - title: "Anthropic Closes +17% at $97.17 on Day One, ~$1.76T Fully Diluted"
    summary:
      - "ANT opened $111.50 (+34%), hit $115.10 intraday, then gave back most of the pop to close $97.17."
      - "Fully diluted valuation ~$1.76T; non-diluted market cap ~$1.27T."
      - "After-hours slipped to $92.60 (-4.7%) as the Nasdaq fell 2.2% on the session."
      - "Largest IPO on record at ~$81.3B raised; 30-day greenshoe for up to 147M more shares still open."
      - "HN first-day threads: 923 and 986 points, 1,824 and 1,913 comments."
