  - title: "Meta's Muse Models Land on Google Cloud; Pichai Welcomes Zuckerberg to Model Garden"
    summary:
      - "Three Muse models — Ember, Spark 1.3, and Wonder — enter public preview on Vertex AI Model Garden and the Gemini Enterprise Agent Platform."
      - "Pichai reply on X: `Congrats and welcome to the model garden, excited to serve our Google Cloud customers!`"
      - "Managed APIs ship with VPC Service Controls, SOC 2 and ISO 27001 compliance, and unified Google Cloud billing."
      - "Rollout extends Meta's cross-cloud push already live on AWS SageMaker, Microsoft Foundry, Oracle, and Hugging Face."
      - "Google serving a direct frontier-lab rival through its own API is the new signal — not a merger, not a co-dev deal."
    url: "https://cryptobriefing.com/meta-muse-models-google-cloud/"
    source: "cryptobriefing.com"
    tag: "industry"
    significance: 5

  - title: "shadcn/improve Crosses 11k Stars With Audit-Plan-Execute Split"
    summary:
      - "Agent skill from shadcn hits 11.1k stars with just 23 commits on main; +361 stars today keeps it on GitHub Trending."
      - "Strong model audits the codebase and writes plain-markdown plans; `/improve execute <plan>` dispatches a cheaper executor in a git worktree and reviews its diff."
      - "Nine parallel subagent categories: correctness, security, perf, test coverage, tech debt, deps/migrations, DX, docs, direction."
      - "Commands include `/improve quick`, `/improve deep`, `/improve branch`, `/improve next`, `/improve reconcile`, and `--issues` to publish plans as GitHub issues."
      - "Install with `npx skills add shadcn/improve`; MIT, read-only on source code by design."
    url: "https://github.com/shadcn/improve"
    source: "github.com"
    tag: "tools"
    significance: 4

