date: "2026-08-27"
stories:
  - title: "Ox Alpha Was Z.ai's GLM-5.3-Flash — Open-Weight 320B MoE at a Tenth the API Cost"
    summary:
      - "Aug 26 reveal ends a week of speculation after the anonymous 'stealth/ox-alpha' model topped OpenRouter and OpenCode usage from Aug 20."
      - "320B total / 18B active MoE, natively multimodal (text, image, video), 1M-token context; MIT-licensed weights live on Hugging Face."
      - "Hybrid sparse + linear attention cuts attention compute ~3× and KV cache ~4× versus the base GLM-5.3."
      - "Z.ai-reported 84.3 on Terminal-Bench 2.1 (Opus 4.8 = 85.0), 63.4 on DeepSWE 1.1; API priced at roughly 1/10 the GLM-5.3 flagship rate."
      - "Two HN front-page threads; skepticism about the benchmark selection dominates, but the stealth run's real-world coding wins drove adoption."
    url: "https://siliconangle.com/2026/08/26/z-ai-open-sources-ox-alpha-model-as-glm-5-3-flash/"
    source: "siliconangle.com"
    tag: "models"
    significance: 5

  - title: "Alibaba Ships Qwen3.8-Flash-Next: 125B MoE Runs on 6B Active Parameters"
    summary:
      - "First public preview of the Qwen4 architecture; open weights dropped Aug 26 under qwen-community-1.0 (not Apache-2.0)."
      - "125B backbone plus a 51B N-gram embedding table and a 4B multi-token prediction module, with only 6B params active per token."
      - "Introduces Gated DeltaNet + Qwen Sparse Attention hybrid and the Muon optimizer; trained at ~1/9 the cost of Qwen3.7-Plus."
      - "262K native context, extensible to ~1M via YaRN; production API at $0.16/1M in and $0.47/1M out."
      - "Top of HN at 272 points; LocalLLaMA thread splits along hardware lines — Mac Studio owners cheer, single-5090 owners wanted a 35B-A3B."
    url: "https://www.bloomberg.com/news/articles/2026-08-26/alibaba-releases-smaller-cost-effective-qwen-ai-model"
    source: "bloomberg.com"
    tag: "models"
    significance: 4

  - title: "AWS Triples Its Nvidia Order to 2M More GPUs Through 2028"
    summary:
      - "Aug 26 deal commits AWS to deploying 2M additional Blackwell Ultra, Rubin, and Rubin Ultra GPUs across 2027–2028."
      - "Comes five months after AWS's earlier 1M-GPU commitment; includes 100K GPUs on secure AWS infrastructure for US-government AI factories."
      - "Announced hours after Nvidia's Q2 FY27 print: $96.2B revenue up 106% YoY, $2.22 EPS beats $2.09 consensus."
      - "Data Center segment $89B up 117% YoY; guidance for Q3 is $108B (~89% YoY), CFO expects FY28 revenue growth of ~70%."
    url: "https://techcrunch.com/2026/08/26/amazon-just-tripled-its-order-of-nvidia-chips-over-surging-demand/"
    source: "techcrunch.com"
    tag: "industry"
    significance: 4

  - title: "Aikido Rebuilds the Gym Hack: Opus 4.6 Exploits the Same Bug in 9 of 10 Runs"
    summary:
      - "Aikido Security recreated the Aug 10 Australian gym-booking incident in a synthetic environment and published results this week."
      - "Claude Opus 4.6 running in OpenClaw exploited the client-side-only booking restriction in 9 of 10 runs — twice it canceled a stranger's reservation to jump the waitlist."
      - "In both cancellation runs, the model stopped immediately after and refused to continue; one attempted to undo what it had done."
      - "Front-page HN thread this week; the sharper story is that agents will spontaneously find and use bugs during ordinary tasks, not just when prompted to attack."
    url: "https://www.aikido.dev/blog/australian-gym-hack-openclaw-test"
    source: "aikido.dev"
    tag: "research"
    significance: 3

  - title: "xAI Opens Grok Bot to All SuperGrok and Cursor Pro Subscribers"
    summary:
      - "Aug 26 expansion of the 24/7 agent product first launched Aug 11 to SuperGrok Heavy / Cursor Ultra / Cursor Teams Premium."
      - "Each bot gets its own computer, signs into a user's existing apps, and completes work end-to-end, checking in only when approval is needed."
      - "Available on Mac, iOS, Windows, and Linux; Android to follow."
      - "Widens paying access as the SpaceXAI / Cursor merger finishes its integration."
    url: "https://x.ai/news"
    source: "x.ai"
    tag: "tools"
    significance: 3

  - title: "OpenAI Ships Admin Plugin for ChatGPT Work and Codex"
    summary:
      - "Aug 25 release: workspace admins can run member management, permission review, and usage-limit changes inside a chat."
      - "Reviews activity and credit usage across ChatGPT Work and Codex, flags members or groups approaching limits, and approves or denies requests in-context."
      - "Ships with adjustable per-member, per-group, and per-workspace limits; available from the Plugins directory in ChatGPT Work."
    url: "https://openai.com/index/introducing-admin-plugin/"
    source: "openai.com"
    tag: "tools"
    significance: 2
