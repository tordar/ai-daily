  - title: "Nvidia Reports Q3 FY27 Earnings Today — $108B Guide, ±10.6% Implied Move"
    summary:
      - "After-close release today (Nov 17), 5 p.m. ET call — the AI industry's most-watched print of the quarter."
      - "Company guided $108.0B revenue (±2%) and 74.0% gross margin; consensus ~$109B and $2.47 EPS."
      - "Prior quarter set a record at $96.2B, up 18% QoQ and 106% YoY."
      - "Shares fell 4.3% on Nov 9 after reports of a board probe tied to a former Megaspeed executive and alleged foreign intel contact around Jensen Huang."
      - "Options market pricing the biggest implied move since 2023, with the Q4 guide seen as the real swing factor."
