  - title: "14 npm Packages Drop an LLM-Powered RedC2 Backdoor That --ignore-scripts Can't Block"
    summary:
      - "TrendAI disclosure Aug 20, still on the HN front page Aug 24: streak-metrics-math, kit-map-vim, streak-map-cache and 11 similarly named 'calendar' utilities drop RedC2 4.0's RedShell Linux beacon on import."
      - "Payload lives in dist/index.mjs and runs from any require/import in the dependency graph — no npm lifecycle hook, so --ignore-scripts doesn't stop it."
      - "RedC2 ships 'Red Agent,' an LLM layer that turns natural-language operator intent into framework beacon commands across Windows, macOS, and Linux."
      - "Infrastructure overlaps with prior npm attacks TrendAI attributes to North Korean actors (Mastra, Axios); persistence via cron, shell rc, systemd-user, and desktop autostart."
    url: "https://thehackernews.com/2026/08/14-trojanized-npm-packages-drop-redc2.html"
    source: "thehackernews.com"
    tag: "research"
    significance: 3
