      - "AG-UI bridge lets agents built on LangGraph, Mastra, CrewAI, and Pydantic AI plug in without rewriting."
      - "Framed as an `alpha template` — not a hosted service — explicitly pitched against xAI's Grok Bot and OpenAI's Dots."
