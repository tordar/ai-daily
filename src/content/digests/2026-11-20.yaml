      - "OpenAI says it used its own models to speed the RTL and verification loops during design."
      - "First deployments late 2026, scaling through 2027 with Microsoft as a launch customer."
      - "Decouples OpenAI's inference roadmap from Nvidia supply after a week of circular-financing debate."
      - "HN thread: 220 points, 168 comments."
